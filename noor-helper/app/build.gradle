plugins {
    id 'com.android.application'
}

android {
    namespace 'com.khutwa.noorhelper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.khutwa.noorsmartfree119'
        minSdk 23
        targetSdk 34
        versionCode 46
        versionName '1.0.19'
    }

    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
