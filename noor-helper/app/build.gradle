plugins {
    id 'com.android.application'
}

android {
    namespace 'com.khutwa.noorhelper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.khutwa.noorhelper.compat'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '0.1.1'
    }

    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }
}
