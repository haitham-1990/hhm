<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>خطوة | مباراة المعرفة 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020810;color:#fff;font-family:Arial,"Noto Sans Arabic",sans-serif;touch-action:none}
#game,canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;z-index:20;top:10px;left:18px;right:18px;height:58px;display:grid;grid-template-columns:1fr 180px 1fr;gap:10px;direction:ltr;pointer-events:none}
.team,.score{background:rgba(5,15,28,.84);border:1px solid rgba(255,255,255,.17);backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.team{border-radius:16px;display:flex;align-items:center;padding:0 20px;font-weight:900;font-size:19px;direction:rtl}
#blue{background:linear-gradient(90deg,rgba(12,91,191,.96),rgba(4,22,42,.88))}
#red{background:linear-gradient(270deg,rgba(186,42,42,.96),rgba(42,8,15,.88))}
.score{border-radius:16px;text-align:center;padding:5px 8px}
#score{font-size:30px;font-weight:900;line-height:31px}#clock{font-size:13px;color:#bed4e3;margin-top:3px}
#question{position:fixed;z-index:25;top:78px;left:50%;transform:translateX(-50%);width:min(620px,48vw);background:rgba(4,16,29,.88);border:1px solid rgba(113,203,255,.3);border-radius:17px;padding:10px 12px 12px;box-shadow:0 12px 36px rgba(0,0,0,.38);transition:.22s}
#question.hide{opacity:0;transform:translate(-50%,-16px);pointer-events:none}
#q{font-size:18px;font-weight:900;text-align:center;margin:1px 0 5px}
#sub{font-size:11px;text-align:center;color:#b9d8e8;margin-bottom:7px}
#answers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;direction:rtl}
.a{min-height:39px;border:1px solid rgba(255,255,255,.14);border-radius:11px;background:linear-gradient(#173a58,#0d273d);color:#fff;font-size:15px;font-weight:900}
.a:active{transform:scale(.98)}
#answers.kickoff{grid-template-columns:1fr 1fr}.buzz{font-size:16px;min-height:44px}.buzz.b{background:linear-gradient(#2388ed,#0e5ab2)}.buzz.r{background:linear-gradient(#ec4e4e,#a51f28)}
#event{position:fixed;z-index:24;left:50%;bottom:42px;transform:translateX(-50%);background:rgba(3,12,22,.86);border:1px solid rgba(255,255,255,.17);border-radius:15px;padding:10px 20px;min-width:280px;text-align:center;font-weight:900;font-size:17px;opacity:0;transition:.2s}
#event.show{opacity:1}
#attack{position:fixed;z-index:22;left:24%;right:24%;bottom:15px;height:8px;border-radius:20px;background:rgba(255,255,255,.16);overflow:hidden}
#attackBar{width:0;height:100%;background:linear-gradient(90deg,#39bdff,#8ee8ff);transition:.4s}
#goal{position:fixed;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(20,125,230,.15),transparent 50%);transition:.15s}
#goal.show{opacity:1}
#goalText{font-size:min(11vw,110px);font-weight:1000;text-shadow:0 8px 30px #000,0 0 25px rgba(66,183,255,.8);transform:scale(.75);transition:.25s}
#goal.show #goalText{transform:scale(1)}
#tag{position:fixed;z-index:18;right:18px;bottom:20px;padding:6px 10px;border-radius:10px;background:rgba(3,12,22,.65);border:1px solid rgba(255,255,255,.12);font-size:10px;color:#b7cada;pointer-events:none}
#startHint{position:fixed;z-index:21;left:18px;bottom:20px;background:rgba(3,12,22,.55);padding:5px 9px;border-radius:9px;font-size:10px;color:#b8d0de}
@media(max-width:900px){
#hud{grid-template-columns:1fr 128px 1fr;height:48px}.team{font-size:13px;padding:0 10px}.score{padding-top:2px}#score{font-size:24px}#clock{font-size:11px}
#question{top:65px;width:57vw;padding:7px 9px 9px}#q{font-size:14px}#sub{font-size:9px;margin-bottom:5px}.a{font-size:12px;min-height:31px}.buzz{font-size:13px;min-height:35px}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="team" id="blue">الفريق الأزرق</div><div class="score"><div id="score">0 - 0</div><div id="clock">08:00</div></div><div class="team" id="red">الفريق الأحمر</div></div>
<div id="question"><div id="q">استعد لبداية المباراة</div><div id="sub">المعرفة هي يد التحكم</div><div id="answers"></div></div>
<div id="event"></div><div id="attack"><div id="attackBar"></div></div>
<div id="goal"><div id="goalText">هــــدف!</div></div>
<div id="tag">مباراة المعرفة 3D • خطوة</div><div id="startHint">اضغط أي إجابة لتفعيل صوت الجمهور</div>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="SkeletonUtils.js"></script>
<script>
(function(){
const GAME=document.getElementById('game'),QBOX=document.getElementById('question'),Q=document.getElementById('q'),SUB=document.getElementById('sub'),ANS=document.getElementById('answers');
const EVENT=document.getElementById('event'),BAR=document.getElementById('attackBar'),SCORE=document.getElementById('score'),CLOCK=document.getElementById('clock'),GOAL=document.getElementById('goal'),START=document.getElementById('startHint');

const scene=new THREE.Scene();scene.background=new THREE.Color(0x07101b);scene.fog=new THREE.Fog(0x07101b,48,105);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;GAME.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,180);camera.position.set(0,13.5,26);let camLook=new THREE.Vector3(0,0,0);

scene.add(new THREE.HemisphereLight(0xc9e7ff,0x12200d,1.05));
const sun=new THREE.DirectionalLight(0xffffff,1.65);sun.position.set(-18,31,15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-38;sun.shadow.camera.right=38;sun.shadow.camera.top=27;sun.shadow.camera.bottom=-27;scene.add(sun);
[-30,30].forEach(function(x){[-21,21].forEach(function(z){const s=new THREE.SpotLight(0xf1f8ff,2.4,95,Math.PI/5,.5,1.15);s.position.set(x,26,z);s.target.position.set(0,0,0);scene.add(s,s.target)})});

const pitchMat=new THREE.MeshStandardMaterial({color:0x176d39,roughness:.93});
const pitch=new THREE.Mesh(new THREE.PlaneGeometry(64,40),pitchMat);pitch.rotation.x=-Math.PI/2;pitch.receiveShadow=true;scene.add(pitch);
for(let i=0;i<12;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(64/12,40),new THREE.MeshBasicMaterial({color:i%2?0x1d7d43:0x176c38,transparent:true,opacity:.36}));m.rotation.x=-Math.PI/2;m.position.set(-29.333+i*(64/12),.006,0);scene.add(m)}
const lm=new THREE.LineBasicMaterial({color:0xf5f7f5});
function fieldLine(a){const g=new THREE.BufferGeometry().setFromPoints(a.map(function(v){return new THREE.Vector3(v[0],.035,v[1])}));scene.add(new THREE.Line(g,lm))}
fieldLine([[-32,-20],[32,-20],[32,20],[-32,20],[-32,-20]]);fieldLine([[0,-20],[0,20]]);
function ring(r,cx,cz){const p=[];for(let i=0;i<=72;i++){const a=i/72*Math.PI*2;p.push([cx+Math.cos(a)*r,cz+Math.sin(a)*r])}fieldLine(p)}
ring(5,0,0);
fieldLine([[-32,-10],[-22,-10],[-22,10],[-32,10]]);fieldLine([[32,-10],[22,-10],[22,10],[32,10]]);
fieldLine([[-32,-4.7],[-27.2,-4.7],[-27.2,4.7],[-32,4.7]]);fieldLine([[32,-4.7],[27.2,-4.7],[27.2,4.7],[32,4.7]]);

function goalFrame(x,dir){
 const white=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5});
 function box(sx,sy,sz,px,py,pz){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),white);m.position.set(px,py,pz);m.castShadow=true;scene.add(m)}
 box(.13,2.7,.13,x,1.35,-4.8);box(.13,2.7,.13,x,1.35,4.8);box(.13,.13,9.7,x,2.67,0);
 const net=new THREE.Mesh(new THREE.BoxGeometry(1.25,2.5,9.45),new THREE.MeshBasicMaterial({color:0xcfeeff,wireframe:true,transparent:true,opacity:.21}));
 net.position.set(x+dir*.62,1.25,0);scene.add(net)
}
goalFrame(-32,-1);goalFrame(32,1);

const stand=new THREE.MeshStandardMaterial({color:0x111a25,roughness:.9});
[[-0,0,-24,72,8,8],[-0,0,24,72,8,8],[-37,0,0,8,8,46],[37,0,0,8,8,46]].forEach(function(v){const m=new THREE.Mesh(new THREE.BoxGeometry(v[3],v[4],v[5]),stand);m.position.set(v[0],4,v[2]);scene.add(m)});
const crowdGeo=new THREE.BoxGeometry(.16,.35,.16),crowdMat=[0x236ac4,0xca353e,0xd2d4d5,0x697d8e,0x202b36].map(function(c){return new THREE.MeshBasicMaterial({color:c})});
for(let side=0;side<2;side++){const z=side?22.1:-22.1;for(let row=0;row<7;row++)for(let i=0;i<75;i++){const f=new THREE.Mesh(crowdGeo,crowdMat[(i+row*2)%crowdMat.length]);f.position.set(-34+i*.92,1.05+row*.58,z+(side?-row*.30:row*.30));f.userData.phase=(i+row)*.37;scene.add(f)}}
const boardMat=new THREE.MeshBasicMaterial({color:0x0a4b8d});
for(let i=-5;i<=5;i++){[-20.35,20.35].forEach(function(z){const b=new THREE.Mesh(new THREE.BoxGeometry(5.3,.9,.18),boardMat);b.position.set(i*5.7,.47,z);scene.add(b)})}

const ballRoot=new THREE.Group(),ball=new THREE.Mesh(new THREE.SphereGeometry(.34,24,16),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.45}));ball.castShadow=true;ballRoot.add(ball);
for(let i=0;i<8;i++){const d=new THREE.Mesh(new THREE.SphereGeometry(.06,8,6),new THREE.MeshBasicMaterial({color:0x111111}));const a=i/8*Math.PI*2;d.position.set(Math.cos(a)*.32,Math.sin(a*2)*.18,Math.sin(a)*.32);ballRoot.add(d)}scene.add(ballRoot);ballRoot.position.set(0,.36,0);

const teamCfg=[
 {name:'الأزرق',color:0x176fd0,shorts:0xffffff,socks:0x176fd0,gk:0xf2c84b},
 {name:'الأحمر',color:0xd53a3a,shorts:0xffffff,socks:0xd53a3a,gk:0x61c06a}
];
const names=[['سالم','خالد','مازن','أحمد','يوسف','طارق'],['راشد','فيصل','محمد','عبدالله','سعيد','نواف']];
const home=[
 [[-28,0],[-18,-9],[-18,9],[-7,0],[3,-8],[3,8]],
 [[28,0],[18,-9],[18,9],[7,0],[-3,-8],[-3,8]]
];
const players=[[],[]],mixers=[],rigData=new Map();
let template=null,fitScale=1,fitMinY=0,ready=false;

function kitMat(color){return new THREE.MeshStandardMaterial({color:color,roughness:.78})}
function applyKit(root,team,isGK){
 const cfg=teamCfg[team],jersey=kitMat(isGK?cfg.gk:cfg.color),pants=kitMat(isGK?0x1b2932:cfg.shorts),socks=kitMat(isGK?cfg.gk:cfg.socks),shoes=kitMat(0x15181b);
 root.traverse(function(o){
   if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;
   function swap(m){if(!m)return m;const n=(m.name||'').toLowerCase();if(n.indexOf('shirt')>=0)return jersey;if(n.indexOf('pants')>=0)return pants;if(n.indexOf('socks')>=0)return socks;if(n.indexOf('shoes')>=0)return shoes;return m.clone()}
   o.material=Array.isArray(o.material)?o.material.map(swap):swap(o.material)
 })
}
function labelSprite(team,index){
 const cv=document.createElement('canvas');cv.width=320;cv.height=78;const c=cv.getContext('2d');c.fillStyle='rgba(2,9,15,.82)';c.beginPath();c.roundRect(7,7,306,64,20);c.fill();c.font='bold 31px Arial';c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';c.fillText(names[team][index]+'  '+(index+1),160,40);
 const tex=new THREE.CanvasTexture(cv);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));sp.scale.set(3.2,.78,1);sp.position.set(0,2.3,0);return sp
}
function clipMap(anims){const m={};anims.forEach(function(c){m[c.name.replace(/^HumanArmature\|Man_/,'')]=c});return m}
function play(p,key,loop){
 const d=rigData.get(p);if(!d)return;let clip=d.clips[key]||d.clips.Idle||d.all[0];if(!clip)return;
 let a=d.mixer.clipAction(clip);if(d.active!==a){if(d.active)d.active.fadeOut(.14);a.reset().fadeIn(.14);a.enabled=true;a.setLoop(loop===false?THREE.LoopOnce:THREE.LoopRepeat);a.clampWhenFinished=loop===false;a.play();d.active=a}
 if(key==='Run')a.timeScale=1.25;else a.timeScale=1
}
new THREE.GLTFLoader().load('player.glb',function(gltf){
 template=gltf.scene;const clips=clipMap(gltf.animations);
 template.updateMatrixWorld(true);
 const box=new THREE.Box3().setFromObject(template);const h=box.max.y-box.min.y;fitScale=h>0?1.82/h:1;fitMinY=box.min.y;
 for(let t=0;t<2;t++)for(let i=0;i<6;i++){
   const rig=THREE.SkeletonUtils.clone(template);rig.scale.multiplyScalar(fitScale);rig.position.y=-fitMinY*fitScale;applyKit(rig,t,i===0);
   const root=new THREE.Group();root.add(rig);root.add(labelSprite(t,i));root.position.set(home[t][i][0],0,home[t][i][1]);root.rotation.y=t===0?Math.PI/2:-Math.PI/2;scene.add(root);
   const mixer=new THREE.AnimationMixer(rig);mixers.push(mixer);rigData.set(root,{mixer:mixer,clips:clips,all:gltf.animations,active:null,rig:rig});players[t][i]=root;play(root,'Idle',true)
 }
 ready=true;showKickoff()
},undefined,function(err){Q.textContent='تعذر تحميل لاعب كرة القدم';SUB.textContent='أعد تشغيل التطبيق';console.log(err)});

const qs=[
 {q:'كم ناتج 7 × 8 ؟',a:['54','56','63','48'],ok:1},
 {q:'ما عاصمة سلطنة عُمان؟',a:['صحار','نزوى','مسقط','صلالة'],ok:2},
 {q:'ما ناتج 45 ÷ 9 ؟',a:['4','5','6','9'],ok:1},
 {q:'ما الكوكب الأحمر؟',a:['الزهرة','المريخ','عطارد','المشتري'],ok:1},
 {q:'كم ضلعًا للمسدس؟',a:['5','6','7','8'],ok:1},
 {q:'ما ناتج 9 × 6 ؟',a:['45','54','56','63'],ok:1}
];
let qi=0,pos=-1,holder=3,stage=0,busy=false,bs=0,rs=0,matchStart=performance.now();
const route=[[3,4,5,1],[3,4,5,1]];

let audio=null,crowdGain=null;
function audioStart(){
 if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)();
 const len=audio.sampleRate*2,buf=audio.createBuffer(1,len,audio.sampleRate),arr=buf.getChannelData(0);for(let i=0;i<len;i++)arr[i]=(Math.random()*2-1)*(.2+.15*Math.sin(i*.0009));
 const src=audio.createBufferSource();src.buffer=buf;src.loop=true;const lp=audio.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1200;crowdGain=audio.createGain();crowdGain.gain.value=.035;src.connect(lp).connect(crowdGain).connect(audio.destination);src.start()
}
function roar(){
 audioStart();if(!crowdGain)return;const n=audio.currentTime;crowdGain.gain.cancelScheduledValues(n);crowdGain.gain.setValueAtTime(.05,n);crowdGain.gain.linearRampToValueAtTime(.28,n+.2);crowdGain.gain.exponentialRampToValueAtTime(.04,n+2.2)
}
function kickSound(){audioStart();if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.setValueAtTime(90,audio.currentTime);o.frequency.exponentialRampToValueAtTime(45,audio.currentTime+.09);g.gain.setValueAtTime(.22,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.11);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}

function eventText(s,ms){EVENT.textContent=s;EVENT.classList.add('show');clearTimeout(eventText.t);eventText.t=setTimeout(function(){EVENT.classList.remove('show')},ms||900)}
function hideQ(v){QBOX.classList.toggle('hide',v)}
function showKickoff(){
 if(!ready)return;Q.textContent=qs[qi].q;SUB.textContent='الأسرع يختار فريقه ثم يجيب';ANS.className='kickoff';ANS.innerHTML='';
 const b=document.createElement('button'),r=document.createElement('button');b.className='a buzz b';r.className='a buzz r';b.textContent='🔵 الأزرق يجيب';r.textContent='🔴 الأحمر يجيب';b.onclick=function(){choose(0)};r.onclick=function(){choose(1)};ANS.append(b,r)
}
function choose(t){audioStart();START.style.display='none';if(busy)return;pos=t;holder=3;stage=0;eventText(t===0?'استحواذ للفريق الأزرق':'استحواذ للفريق الأحمر',700);showAnswers();setBall()}
function showAnswers(){const item=qs[qi];Q.textContent=item.q;SUB.textContent=stage>=3?'الإجابة الصحيحة = تسديدة على المرمى':'الصحيح = تمريرة • الخطأ = قطع الكرة';ANS.className='';ANS.innerHTML='';item.a.forEach(function(x,i){const b=document.createElement('button');b.className='a';b.textContent=x;b.onclick=function(){answer(i)};ANS.appendChild(b)})}
function nextQ(){qi=(qi+1)%qs.length}
function answer(i){audioStart();if(busy||pos<0)return;const good=i===qs[qi].ok;nextQ();if(stage>=3)shoot(good);else if(good)passBall();else steal()}
function setBall(){const p=players[pos][holder].position;ballRoot.position.set(p.x,.36,p.z)}
function face(p,x,z){p.rotation.y=Math.atan2(x,z)}
function tween(ms,step,done){const s=performance.now();function f(n){let t=Math.min(1,(n-s)/ms),e=.5-.5*Math.cos(Math.PI*t);step(e,t);if(t<1)requestAnimationFrame(f);else if(done)done()}requestAnimationFrame(f)}
function follow(x,z,close){const targetX=THREE.MathUtils.clamp(x,-19,19);const targetZ=z*.16;const px=targetX*.24,py=close?10.8:12.8,pz=close?21.5:25.5;camera.position.lerp(new THREE.Vector3(px,py,pz+targetZ*.08),.08);camLook.lerp(new THREE.Vector3(targetX*.58,.5,targetZ),.13)}
function passBall(){
 busy=true;hideQ(true);const seq=route[pos],from=holder,to=seq[Math.min(stage+1,seq.length-1)],P=players[pos][from],R=players[pos][to],atk=pos===0?1:-1;
 const sx=P.position.x,sz=P.position.z,tx=R.position.x+atk*3.2,tz=R.position.z+(stage%2===0?1.3:-1.0);
 face(P,tx-sx,tz-sz);face(R,atk,0);play(P,'Punch',false);play(R,'Run',true);kickSound();eventText('إجابة صحيحة — تمريرة ناجحة!',950);
 tween(920,function(e){R.position.x=THREE.MathUtils.lerp(R.position.x,tx,.055);R.position.z=THREE.MathUtils.lerp(R.position.z,tz,.055);ballRoot.position.x=THREE.MathUtils.lerp(sx,tx,e);ballRoot.position.z=THREE.MathUtils.lerp(sz,tz,e);ballRoot.position.y=.36+Math.sin(Math.PI*e)*.48;ballRoot.rotation.x+=.19;follow(ballRoot.position.x,ballRoot.position.z,false)},function(){holder=to;stage++;play(P,'Idle',true);play(R,'Idle',true);setBall();BAR.style.width=(stage/4*100)+'%';busy=false;hideQ(false);showAnswers()})
}
function closest(other,x,z){let bi=1,bd=999;for(let i=1;i<6;i++){const p=players[other][i].position,d=(p.x-x)*(p.x-x)+(p.z-z)*(p.z-z);if(d<bd){bd=d;bi=i}}return bi}
function steal(){
 busy=true;hideQ(true);const other=1-pos,P=players[pos][holder],idx=closest(other,P.position.x,P.position.z),D=players[other][idx];const sx=P.position.x,sz=P.position.z,tx=(P.position.x+D.position.x)*.5,tz=(P.position.z+D.position.z)*.5;
 play(D,'Run',true);face(D,tx-D.position.x,tz-D.position.z);eventText('خطأ! الخصم يقطع الكرة',1100);
 tween(720,function(e){D.position.x=THREE.MathUtils.lerp(D.position.x,tx,.075);D.position.z=THREE.MathUtils.lerp(D.position.z,tz,.075);ballRoot.position.x=THREE.MathUtils.lerp(sx,tx,e);ballRoot.position.z=THREE.MathUtils.lerp(sz,tz,e);ballRoot.position.y=.35+Math.sin(Math.PI*e)*.14;follow(ballRoot.position.x,ballRoot.position.z,true)},function(){play(D,'Punch',false);kickSound();setTimeout(function(){pos=other;holder=idx;stage=0;play(D,'Idle',true);setBall();BAR.style.width='0%';busy=false;hideQ(false);showAnswers()},220)})
}
function goalieDive(team,zTarget){
 const G=players[team][0];play(G,'Jump',false);const baseX=home[team][0][0],baseZ=home[team][0][1],dir=zTarget>=0?1:-1;
 tween(650,function(e){G.position.z=baseZ+dir*2.25*Math.sin(Math.PI*e*.8);G.position.y=.12+Math.sin(Math.PI*e)*.65;G.rotation.z=dir*.9*Math.sin(Math.PI*e)},function(){setTimeout(function(){G.position.set(baseX,0,baseZ);G.rotation.z=0;G.rotation.y=team===0?Math.PI/2:-Math.PI/2;play(G,'Idle',true)},500)})
}
function shoot(good){
 busy=true;hideQ(true);const P=players[pos][holder],def=1-pos,G=players[def][0],gx=pos===0?31.6:-31.6,gz=(Math.random()-.5)*6.2,sx=P.position.x,sz=P.position.z;
 face(P,gx-sx,gz-sz);play(P,'Punch',false);kickSound();goalieDive(def,gz);eventText(good?'تسديــــدة قوية!':'تسديدة تحت الضغط...',800);
 tween(820,function(e){ballRoot.position.x=THREE.MathUtils.lerp(sx,gx,e);ballRoot.position.z=THREE.MathUtils.lerp(sz,gz,e);ballRoot.position.y=.38+Math.sin(Math.PI*e)*2.05;ballRoot.rotation.x+=.33;follow(ballRoot.position.x,ballRoot.position.z,true)},function(){
   play(P,'Idle',true);
   if(good){if(pos===0)bs++;else rs++;SCORE.textContent=bs+' - '+rs;GOAL.classList.add('show');roar();players[pos].forEach(function(pp,i){if(i>0)play(pp,'Jump',false)});setTimeout(function(){GOAL.classList.remove('show')},1600);eventText('⚽ هــــدف! إجابة صحيحة',1800)}
   else eventText('الحارس يتصدى! الكرة للفريق الآخر',1500);
   setTimeout(resetKickoff,good?2000:1600)
 })
}
function resetKickoff(){for(let t=0;t<2;t++)for(let i=0;i<6;i++){const p=players[t][i];p.position.set(home[t][i][0],0,home[t][i][1]);p.rotation.z=0;p.rotation.y=t===0?Math.PI/2:-Math.PI/2;play(p,'Idle',true)}pos=-1;holder=3;stage=0;BAR.style.width='0%';ballRoot.position.set(0,.36,0);camera.position.set(0,13.5,26);camLook.set(0,0,0);busy=false;hideQ(false);showKickoff()}

let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000);last=now;mixers.forEach(function(m){m.update(dt)});
 const t=now*.001;scene.children.forEach(function(o){if(o.userData&&o.userData.phase!==undefined)o.position.y+=Math.sin(t*2.4+o.userData.phase)*.0007});
 if(!busy&&pos>=0){const p=players[pos][holder].position;follow(p.x,p.z,false)}
 camera.lookAt(camLook);
 const sec=Math.max(0,480-Math.floor((now-matchStart)/1000));CLOCK.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
 renderer.render(scene,camera)
}
requestAnimationFrame(animate);
addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script>
