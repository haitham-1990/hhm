name: Build MATH EDGE V6.5 Burst Demo
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'DualHedgeMathEdgeV65BurstDemo/**'
      - '.github/workflows/build-math-edge-v65-burst-demo.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: DualHedgeMathEdgeV65BurstDemo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build V6.5 Burst Demo
        run: dotnet build DualHedgeMathEdgeV65BurstDemo.csproj --configuration Release -p:IncludeSource=True -p:AlgoPublish=False
      - name: Verify algorithm file
        run: |
          find . -type f -name '*.algo' -print
          find . -type f -name '*.algo' -print -quit | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: MATH-EDGE-V6-5-BURST-DEMO
          path: DualHedgeMathEdgeV65BurstDemo/**/*.algo
          if-no-files-found: error
