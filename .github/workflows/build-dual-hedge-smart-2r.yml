name: Build Dual Hedge Smart 2R cTrader algo
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'DualHedgeSmart2R/**'
      - '.github/workflows/build-dual-hedge-smart-2r.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: DualHedgeSmart2R
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Dual Hedge Smart 2R
        run: dotnet build DualHedgeSmart2R.csproj --configuration Release -p:IncludeSource=True -p:AlgoPublish=False
      - name: Verify algorithm file
        run: |
          find . -type f -name '*.algo' -print
          find . -type f -name '*.algo' -print -quit | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: Dual-Hedge-Smart-2R-algo
          path: DualHedgeSmart2R/**/*.algo
          if-no-files-found: error
