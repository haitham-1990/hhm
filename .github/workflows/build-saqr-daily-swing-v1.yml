name: Build SAQR Daily Swing V1
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'SaqrDailySwingV1/**'
      - '.github/workflows/build-saqr-daily-swing-v1.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: SaqrDailySwingV1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build SAQR Daily Swing V1
        run: dotnet build SaqrDailySwingV1.csproj --configuration Release -p:IncludeSource=True -p:AlgoPublish=False
      - name: Verify algorithm file
        run: |
          find . -type f -name '*.algo' -print
          find . -type f -name '*.algo' -print -quit | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: SAQR-Daily-Swing-V1-algo
          path: SaqrDailySwingV1/**/*.algo
          if-no-files-found: error
