name: Build MATH EDGE EMA9 VWAP
on:
  push:
    branches: [math-edge-ema9-vwap-20261026, math-edge-ema9-vwap-video-v2-20261026, math-edge-multi-market-v3-20261026, math-edge-multi-market-v4-20261026, math-edge-multi-market-v5-risk-guard-20261026]
    paths:
      - 'MATH_EDGE_EMA9_VWAP/**'
      - 'MATH_EDGE_TESTS/**'
      - '.github/workflows/build-math-edge-ema9-vwap.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check deterministic risk and strategy logic
        run: dotnet run --project MATH_EDGE_TESTS/MATH_EDGE_TESTS.csproj --configuration Release
      - name: Compile cTrader .algo
        run: dotnet build MATH_EDGE_EMA9_VWAP/MATH_EDGE_EMA9_VWAP.csproj --configuration Release -p:IncludeSource=True -p:AlgoPublish=False
      - name: Verify and stage final binary
        shell: bash
        run: |
          mkdir -p ready
          algo=$(find MATH_EDGE_EMA9_VWAP/bin/Release -type f -name '*.algo' -print -quit)
          test -n "$algo"
          cp "$algo" ready/MATH_EDGE_MULTI_MARKET_V5_SAFE.algo
          test -s ready/MATH_EDGE_MULTI_MARKET_V5_SAFE.algo
          sha256sum ready/MATH_EDGE_MULTI_MARKET_V5_SAFE.algo
      - uses: actions/upload-artifact@v4
        with:
          name: MATH_EDGE_MULTI_MARKET_V5_SAFE_algo
          path: ready/MATH_EDGE_MULTI_MARKET_V5_SAFE.algo
          if-no-files-found: error
