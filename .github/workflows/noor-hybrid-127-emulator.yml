name: Noor Hybrid 1.0.27 Android Emulator Smoke
on:
  push:
    branches: [noor-hybrid-1.0.27-teacher-review]
    paths: ['.github/workflows/noor-hybrid-127-emulator.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable /dev/kvm if provided
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; ls -l /dev/kvm; else echo 'No virtualization device'; fi
      - name: Compile app from exact source
        run: |
          base64 -d NoorHybrid-1.0.27-Teacher-Review-project.b64 > project.zip
          unzip -q project.zip
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          gradle -p noor-helper --no-daemon assembleDebug
      - name: Install app, launch, screenshot and capture errors
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p emulator-evidence
            adb install -r noor-helper/app/build/outputs/apk/debug/app-debug.apk | tee emulator-evidence/install.log
            adb shell am start -n com.khutwa.noorhybrid.review127/com.khutwa.noorhelper.MainActivity > emulator-evidence/activity-start.log 2>&1 || true
            sleep 14
            adb exec-out screencap -p > emulator-evidence/launch.png || true
            adb shell dumpsys activity activities > emulator-evidence/activities.txt || true
            adb logcat -d -t 1700 > emulator-evidence/logcat.txt || true
            test -s emulator-evidence/launch.png
            grep -qi 'success' emulator-evidence/install.log
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NoorHybrid-127-Emulator-Evidence
          path: emulator-evidence/
