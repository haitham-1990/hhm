name: Build Khutwa Scalp V3 cTrader algo
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'KhutwaScalpV3/**'
      - '.github/workflows/build-khutwa-v3.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: KhutwaScalpV3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile V3 for cTrader
        run: dotnet build KhutwaScalpV3.csproj --configuration Release -p:IncludeSource=True -p:AlgoPublish=False
      - name: Verify .algo artifact
        run: |
          find . -type f -name '*.algo' -print
          find . -type f -name '*.algo' -print -quit | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: KhutwaScalpV3-algo
          path: KhutwaScalpV3/**/*.algo
          if-no-files-found: error
