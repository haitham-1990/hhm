name: Build Khutwa AI bridge
on:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare source
        run: |
          mkdir -p src/om/khutwa/classroom out dexout
          echo '' | base64 -d > src/om/khutwa/classroom/AiBridge.java
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Compile
        run: |
          javac -source 8 -target 8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d out src/om/khutwa/classroom/AiBridge.java
          D8=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name d8 | sort -V | tail -1)
          "$D8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output dexout out/om/khutwa/classroom/AiBridge.class
      - uses: actions/upload-artifact@v4
        with:
          name: khutwa-ai-bridge
          path: dexout/classes.dex
          retention-days: 1
