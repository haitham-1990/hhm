name: Build Khutwa Football Unity Pro APK
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'KhutwaFootballUnityPro/**'
      - '.github/workflows/build-khutwa-football-unity-pro-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: KhutwaFootballUnityPro
          targetPlatform: Android
          buildMethod: KhutwaFootball.EditorTools.CIAndroidBuilder.Build
          androidExportType: androidPackage
          buildName: Khutwa-Football-Pro
          buildsPath: build

      - name: Verify APK
        run: |
          find build -type f -name '*.apk' -print
          test -f build/Android/Khutwa-Football-Pro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Khutwa-Football-Unity-Pro-APK
          path: build/Android/Khutwa-Football-Pro.apk
          if-no-files-found: error
