name: Build MATH EDGE AI Scalper V3.1
on:
  push:
    branches: [math-edge-ai-scalper-v3-1]
    paths:
      - 'MATH_EDGE_AI_SCALPER_V3_1/**'
      - '.github/workflows/build-math-edge-ai-scalper-v3-1.yml'
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify no external API dependency
        shell: bash
        run: |
          if grep -En 'HttpClient|Http\.Send|workers\.dev|api\.openai\.com' MATH_EDGE_AI_SCALPER_V3_1/MathEdgeAIScalperV31.cs; then
            echo "Unexpected external AI API call"; exit 1
          fi
      - name: Compile .algo using cTrader Automate
        run: dotnet build MATH_EDGE_AI_SCALPER_V3_1/MathEdgeAIScalperV31.csproj --configuration Release -p:IncludeSource=True -p:AlgoPublish=False
      - name: Verify and stage
        shell: bash
        run: |
          mkdir -p ready
          algo=$(find MATH_EDGE_AI_SCALPER_V3_1/bin/Release -type f -name '*.algo' -print -quit)
          test -n "$algo"
          cp "$algo" ready/MATH_EDGE_AI_SCALPER_V3_1.algo
          test -s ready/MATH_EDGE_AI_SCALPER_V3_1.algo
          sha256sum ready/MATH_EDGE_AI_SCALPER_V3_1.algo
      - uses: actions/upload-artifact@v4
        with:
          name: MATH_EDGE_AI_SCALPER_V3_1_algo
          path: ready/MATH_EDGE_AI_SCALPER_V3_1.algo
          if-no-files-found: error
