name: Build GoldTrend RSI ATR ALGO
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'GoldTrendRSIATR/**'
      - '.github/workflows/build-gold-trend-rsi-atr.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build cTrader bot
        run: dotnet build GoldTrendRSIATR/GoldTrendRSIATR.csproj -c Release -p:IncludeSource=True -p:AlgoPublish=False
      - name: Verify ALGO
        run: |
          find GoldTrendRSIATR -type f -name '*.algo' -print
          test -n "$(find GoldTrendRSIATR -type f -name '*.algo' -print -quit)"
      - name: Upload cTrader ALGO
        uses: actions/upload-artifact@v4
        with:
          name: GoldTrendRSIATR-algo
          path: GoldTrendRSIATR/**/*.algo
          if-no-files-found: error
