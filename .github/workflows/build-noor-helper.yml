name: Build Noor Helper APK

on:
  push:
    branches: [ "noor-smart-v1.0.17-question-crops" ]
    paths:
      - "noor-helper/**"
      - ".github/workflows/build-noor-helper.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: noor-helper
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK signature and zip alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs noor-helper/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 noor-helper/app/build/outputs/apk/debug/app-debug.apk
      - name: Inspect manifest
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging noor-helper/app/build/outputs/apk/debug/app-debug.apk | head -n 8
      - name: Copy APK
        run: cp noor-helper/app/build/outputs/apk/debug/app-debug.apk NoorSmart-1.0.17-QuestionCrops.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoorSmart-1.0.17-QuestionCrops
          path: NoorSmart-1.0.17-QuestionCrops.apk
          if-no-files-found: error
