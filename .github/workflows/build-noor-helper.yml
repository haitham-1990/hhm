name: Build Noor Helper APK

on:
  push:
    branches: [ "noor-helper-v0.1.0" ]
    paths:
      - "noor-helper/**"
      - ".github/workflows/build-noor-helper.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: noor-helper
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoorHelper-0.1.0-debug
          path: noor-helper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
