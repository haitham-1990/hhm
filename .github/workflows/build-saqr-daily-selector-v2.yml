name: Build SAQR Daily Selector V2
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'SaqrDailySelectorV2/**'
      - '.github/workflows/build-saqr-daily-selector-v2.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: SaqrDailySelectorV2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build SAQR Daily Selector V2
        run: dotnet build SaqrDailySelectorV2.csproj --configuration Release -p:IncludeSource=True -p:AlgoPublish=False
      - name: Verify algorithm file
        run: |
          find . -type f -name '*.algo' -print
          find . -type f -name '*.algo' -print -quit | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: SAQR-Daily-Selector-V2-algo
          path: SaqrDailySelectorV2/**/*.algo
          if-no-files-found: error
