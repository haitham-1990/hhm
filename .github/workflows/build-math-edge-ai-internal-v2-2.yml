name: Build MATH EDGE AI Internal V2.2
on:
  push:
    branches: [math-edge-ai-internal-v2-2]
    paths:
      - 'MATH_EDGE_AI_Internal_V2_2/**'
      - '.github/workflows/build-math-edge-ai-internal-v2-2.yml'
  workflow_dispatch:
jobs:
  algo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Confirm internal-only model
        shell: bash
        run: |
          if grep -En 'HttpClient|Http\.Send|workers\.dev|api\.openai\.com' MATH_EDGE_AI_Internal_V2_2/MathEdgeAIInternalV22.cs; then
            echo 'Unexpected external AI request'; exit 1
          fi
      - name: Compile cTrader algo
        run: dotnet build MATH_EDGE_AI_Internal_V2_2/MathEdgeAIInternalV22.csproj --configuration Release -p:IncludeSource=True -p:AlgoPublish=False
      - name: Verify compiled output
        shell: bash
        run: |
          mkdir -p ready
          algo=$(find MATH_EDGE_AI_Internal_V2_2/bin/Release -type f -name '*.algo' -print -quit)
          test -n "$algo"
          cp "$algo" ready/MATH_EDGE_AI_INTERNAL_V2_2.algo
          test -s ready/MATH_EDGE_AI_INTERNAL_V2_2.algo
          sha256sum ready/MATH_EDGE_AI_INTERNAL_V2_2.algo
      - uses: actions/upload-artifact@v4
        with:
          name: MATH_EDGE_AI_INTERNAL_V2_2_algo
          path: ready/MATH_EDGE_AI_INTERNAL_V2_2.algo
          if-no-files-found: error
