name: Build Khutwa Knowledge Match APK
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'KhutwaKnowledgeMatch-project.tar.gz.b64'
      - '.github/workflows/build-khutwa-knowledge-match.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project
        run: |
          base64 -d KhutwaKnowledgeMatch-project.tar.gz.b64 > /tmp/khutwa-match.tar.gz
          tar -xzf /tmp/khutwa-match.tar.gz
      - name: Build debug APK
        working-directory: KhutwaKnowledgeMatch
        run: gradle assembleDebug --stacktrace
      - name: Verify APK
        run: test -f KhutwaKnowledgeMatch/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Khutwa-Knowledge-Match-APK
          path: KhutwaKnowledgeMatch/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
