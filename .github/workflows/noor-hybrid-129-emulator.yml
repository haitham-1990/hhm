name: Noor Hybrid 1.0.29 PDF-Only Emulator Smoke
on:
  push:
    branches: [noor-hybrid-1.0.29-pdf-only]
    paths: [.github/workflows/noor-hybrid-129-emulator.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable virtualization acceleration
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Build APK for emulator
        run: |
          base64 -d NoorHybrid-1.0.29-PDF-Only-project.b64 > source.zip
          unzip -q source.zip
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          gradle -p noor-helper --no-daemon assembleDebug
      - name: Install launch screen and crash detection
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p qa-emulator
            adb install -r noor-helper/app/build/outputs/apk/debug/app-debug.apk | tee qa-emulator/install.log
            adb logcat -c
            adb shell am start -n com.khutwa.noorhybrid.pdf129/com.khutwa.noorhelper.MainActivity | tee qa-emulator/start.log
            sleep 15
            adb exec-out screencap -p > qa-emulator/screen.png
            adb shell dumpsys activity activities > qa-emulator/activities.txt
            adb logcat -d -t 2100 > qa-emulator/logcat.txt
            test -s qa-emulator/screen.png
            grep -q 'Success' qa-emulator/install.log
            grep -q 'cmp=com.khutwa.noorhybrid.pdf129/com.khutwa.noorhelper.MainActivity' qa-emulator/activities.txt
            if grep -E 'FATAL EXCEPTION|Process: com.khutwa.noorhybrid.pdf129' qa-emulator/logcat.txt | head -10 | grep -q 'FATAL EXCEPTION'; then exit 1; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NoorHybrid-129-PDF-Only-Emulator
          path: qa-emulator/
