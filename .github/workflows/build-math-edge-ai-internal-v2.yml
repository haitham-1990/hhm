name: Build MATH EDGE AI Internal V2
on:
  push:
    branches: [math-edge-ai-internal-v2]
    paths:
      - 'MATH_EDGE_AI_Internal_V2/**'
      - '.github/workflows/build-math-edge-ai-internal-v2.yml'
  workflow_dispatch:
jobs:
  algo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify offline-only source
        shell: bash
        run: |
          if grep -E -n 'Http\.|HttpClient|workers\.dev|OpenAI|api\.openai\.com' MATH_EDGE_AI_Internal_V2/MathEdgeAIInternalV2.cs; then
            echo 'Forbidden external-API reference detected'; exit 1
          fi
      - name: Build real cTrader .algo
        run: dotnet build MATH_EDGE_AI_Internal_V2/MathEdgeAIInternalV2.csproj --configuration Release -p:IncludeSource=True -p:AlgoPublish=False
      - name: Verify output
        shell: bash
        run: |
          mkdir -p ready
          algo=$(find MATH_EDGE_AI_Internal_V2/bin/Release -type f -name '*.algo' -print -quit)
          test -n "$algo"
          cp "$algo" ready/MATH_EDGE_AI_INTERNAL_V2.algo
          test -s ready/MATH_EDGE_AI_INTERNAL_V2.algo
          sha256sum ready/MATH_EDGE_AI_INTERNAL_V2.algo
      - uses: actions/upload-artifact@v4
        with:
          name: MATH_EDGE_AI_INTERNAL_V2_algo
          path: ready/MATH_EDGE_AI_INTERNAL_V2.algo
          if-no-files-found: error
