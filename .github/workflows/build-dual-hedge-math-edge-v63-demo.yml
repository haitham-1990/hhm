name: Build Dual Hedge Math Edge V6.3 Demo
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'DualHedgeMathEdgeV63Demo/**'
      - '.github/workflows/build-dual-hedge-math-edge-v63-demo.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: DualHedgeMathEdgeV63Demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build V6.3 Demo
        run: dotnet build DualHedgeMathEdgeV63Demo.csproj --configuration Release -p:IncludeSource=True -p:AlgoPublish=False
      - name: Verify algorithm file
        run: |
          find . -type f -name '*.algo' -print
          find . -type f -name '*.algo' -print -quit | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: Dual-Hedge-Math-Edge-V6-3-Demo
          path: DualHedgeMathEdgeV63Demo/**/*.algo
          if-no-files-found: error
