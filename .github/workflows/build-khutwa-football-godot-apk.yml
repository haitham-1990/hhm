name: Build Khutwa Football Godot APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'KhutwaFootballGodotPro/**'
      - '.github/workflows/build-khutwa-football-godot-apk.yml'

env:
  GODOT_VERSION: "4.6"
  PROJECT_PATH: "KhutwaFootballGodotPro"
  EXPORT_NAME: "Khutwa-Football-Godot"

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    container:
      image: barichello/godot-ci:4.6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot export templates
        shell: bash
        run: |
          set -e
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config/godot
          if [ -d /root/.config/godot ]; then cp -a /root/.config/godot/. ~/.config/godot/; fi
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi
          godot --version

      - name: Install build utilities
        shell: bash
        run: |
          apt-get update
          apt-get install -y curl fontconfig openjdk-17-jdk-headless

      - name: Configure Android SDK and signing environment
        shell: bash
        run: |
          set -e
          JAVA_HOME_DIR="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.6.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/debug_keystore = ""
          export/android/debug_keystore_user = ""
          export/android/debug_keystore_pass = ""
          EOF
          echo "JAVA_HOME_DIR=$JAVA_HOME_DIR"
          ls /usr/lib/android-sdk/build-tools

      - name: Fetch CC0 animated player asset
        shell: bash
        run: |
          set -e
          mkdir -p "${PROJECT_PATH}/assets"
          curl -L --fail --retry 3             -o "${PROJECT_PATH}/assets/player.glb"             https://raw.githubusercontent.com/kendrekaran/striker-3d/main/assets/player.glb
          curl -L --fail --retry 3             -o "${PROJECT_PATH}/assets/LICENSE-quaternius.txt"             https://raw.githubusercontent.com/kendrekaran/striker-3d/main/assets/LICENSE-quaternius.txt
          test -s "${PROJECT_PATH}/assets/player.glb"

      - name: Import and validate Godot project
        shell: bash
        run: |
          set -e
          cd "${PROJECT_PATH}"
          godot --headless --editor --quit-after 5 --path . 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" /tmp/godot-import.log; then
            exit 1
          fi

      - name: Build unsigned Android APK
        shell: bash
        run: |
          set -e
          mkdir -p build/android
          EXPORT_DIR="$(readlink -f build/android)"
          cd "${PROJECT_PATH}"
          godot --headless --verbose --path . --export-release "Android Debug" "$EXPORT_DIR/${EXPORT_NAME}-unsigned.apk"

      - name: Sign Android APK
        shell: bash
        run: |
          set -e
          BUILD_TOOLS="$(ls -1 /usr/lib/android-sdk/build-tools | sort -V | tail -1)"
          TOOLS="/usr/lib/android-sdk/build-tools/$BUILD_TOOLS"
          keytool -genkeypair -v             -keystore /tmp/khutwa-debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -dname "CN=Khutwa Debug,O=Khutwa,C=OM"             -keyalg RSA -keysize 2048 -validity 10000
          "$TOOLS/zipalign" -f -p 4             "build/android/${EXPORT_NAME}-unsigned.apk"             "build/android/${EXPORT_NAME}-aligned.apk"
          "$TOOLS/apksigner" sign             --ks /tmp/khutwa-debug.keystore             --ks-key-alias androiddebugkey             --ks-pass pass:android             --key-pass pass:android             --out "build/android/${EXPORT_NAME}.apk"             "build/android/${EXPORT_NAME}-aligned.apk"
          "$TOOLS/apksigner" verify --verbose "build/android/${EXPORT_NAME}.apk"

      - name: Verify APK
        shell: bash
        run: |
          test -s "build/android/${EXPORT_NAME}.apk"
          ls -lh "build/android/${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khutwa-Football-Godot-APK
          path: build/android/Khutwa-Football-Godot.apk
          if-no-files-found: error
