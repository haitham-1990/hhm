name: Build Khutwa Football V2 APK
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'KhutwaFootballV2Live/**'
      - '.github/workflows/build-khutwa-football-v2.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: KhutwaFootballV2Live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: Verify
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Khutwa-Football-V2-APK
          path: KhutwaFootballV2Live/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
