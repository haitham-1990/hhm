name: Noor Hybrid 1.0.29 Original-PDF Per-Lesson Build
on:
  push:
    branches: [noor-hybrid-1.0.29-pdf-only]
    paths:
      - NoorHybrid-1.0.29-PDF-Only-project.b64
      - .github/workflows/noor-hybrid-129-pdf-only.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf_only:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Recover project from exact archived sources
        run: |
          base64 -d NoorHybrid-1.0.29-PDF-Only-project.b64 > project.zip
          unzip -q project.zip
      - name: Test that the active preparation flow does not crop or embed pictures
        run: |
          mkdir -p qa-evidence
          python noor-helper/qa/PdfOnlyLessonFlowTest.py | tee qa-evidence/pdf-only-flow.log
          grep -q 'PASS 16 PDF-only lesson flow checks' qa-evidence/pdf-only-flow.log
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and sign Android APK
        run: gradle -p noor-helper --no-daemon --stacktrace assembleDebug
      - name: Upload APK and source checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NoorHybrid-1.0.29-PDF-Only-APK
          path: |
            noor-helper/app/build/outputs/apk/debug/app-debug.apk
            qa-evidence/pdf-only-flow.log
